{% extends "base.html" %}
{% block title %}Editar Rutina{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100 py-8 px-4">
  <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
    <h1 class="text-2xl font-bold text-emerald-400 mb-6">Editar Rutina</h1>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block mb-1 font-semibold">Nombre</label>
        <input type="text" name="nombre" value="{{ rutina.nombre }}" class="w-full p-2 rounded bg-gray-700 border border-gray-600">
      </div>
      <div>
        <label class="block mb-1 font-semibold">Descripción</label>
        <textarea name="descripcion" rows="3" class="w-full p-2 rounded bg-gray-700 border border-gray-600">{{ rutina.descripcion }}</textarea>
      </div>

      <div>
        <label class="block mb-1 font-semibold">Ejercicios</label>
        <div class="max-h-64 overflow-y-auto bg-gray-700 rounded p-3 border border-gray-600">
          {% for e in ejercicios %}
            <label class="block mb-1">
              <input type="checkbox" name="ejercicios" value="{{ e.id }}" {% if e in rutina.ejercicios.all %}checked{% endif %}> {{ e.nombre }}
            </label>
          {% endfor %}
        </div>
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded">
        Guardar cambios
      </button>
    </form>
  </div>
</div>
{% endblock %}
