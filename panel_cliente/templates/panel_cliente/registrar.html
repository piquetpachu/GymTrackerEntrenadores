{% extends "base.html" %}
{% block title %}Registrar Progreso{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100 py-8 px-4">
  <div class="max-w-lg mx-auto bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
    <h1 class="text-2xl font-bold mb-4 text-center text-emerald-400">
      Registrar progreso — {{ ejercicio.nombre }}
    </h1>
<a href="{% url 'panel_cliente:crear_rutina' %}" 
   class="inline-block bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded font-semibold mb-4">
  ➕ Crear nueva rutina
</a>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label class="block mb-1">Peso (kg)</label>
        <input type="number" step="0.5" name="peso" class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600">
      </div>

      <div>
        <label class="block mb-1">Repeticiones</label>
        <input type="number" name="repeticiones" class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600">
      </div>

      <div>
        <label class="block mb-1">RIR (reps en reserva)</label>
        <input type="number" name="rir" min="0" max="5" class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600">
      </div>

      <div>
        <label class="block mb-1">RPE (esfuerzo percibido)</label>
        <input type="number" name="rpe" min="1" max="10" class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600">
      </div>

      <div>
        <label class="block mb-1">Notas adicionales</label>
        <textarea name="notas" rows="3" class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600"></textarea>
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 rounded">
        Guardar progreso
      </button>
    </form>
  </div>
</div>
{% endblock %}
