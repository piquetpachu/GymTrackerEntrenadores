{% extends "base.html" %}
{% block title %}Eliminar Rutina{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100 py-8 px-4">
  <div class="max-w-lg mx-auto bg-gray-800 p-6 rounded-xl border border-gray-700 text-center shadow-lg">
    <h1 class="text-2xl font-bold text-red-500 mb-4">¿Eliminar rutina?</h1>
    <p class="text-gray-300 mb-6">Esta acción no se puede deshacer.</p>

    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded mr-2">Eliminar</button>
      <a href="{% url 'panel_cliente:detalle_rutina' rutina.id %}" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
