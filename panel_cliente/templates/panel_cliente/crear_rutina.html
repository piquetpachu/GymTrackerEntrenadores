{% extends "base.html" %}
{% block title %}Crear Rutina{% endblock %}

{% block content %}
<a href="{% url 'panel_cliente:crear_rutina' %}" 
   class="inline-block bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded font-semibold mb-4">
  ➕ Crear nueva rutina
</a>

<div class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100 py-8 px-4">
  <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
    <h1 class="text-2xl font-bold text-center text-emerald-400 mb-6">Crear Nueva Rutina</h1>

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block mb-1 font-semibold">Nombre de la rutina</label>
        <input type="text" name="nombre" required class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600">
      </div>

      <div>
        <label class="block mb-1 font-semibold">Descripción</label>
        <textarea name="descripcion" rows="3" class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600"></textarea>
      </div>

      <div>
        <label class="block mb-1 font-semibold">Seleccionar ejercicios</label>
        <div class="max-h-64 overflow-y-auto bg-gray-700 rounded p-3 border border-gray-600">
          {% for e in ejercicios %}
            <label class="block mb-1">
              <input type="checkbox" name="ejercicios" value="{{ e.id }}" class="mr-2">
              {{ e.nombre }}
            </label>
          {% empty %}
            <p class="text-gray-400">No hay ejercicios disponibles.</p>
          {% endfor %}
        </div>
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 rounded">
        Guardar Rutina
      </button>
    </form>
  </div>
</div>
{% endblock %}
