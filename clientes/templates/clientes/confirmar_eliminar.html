{% extends "base.html" %}
{% block title %}Confirmar Eliminación{% endblock %}
{% block content %}
<body>
    <h1>¿Seguro que quieres eliminar a {{ object.nombre }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>
    <a href="{% url 'clientes:lista' %}">Cancelar</a>
</body>
</html>
{% endblock %}
