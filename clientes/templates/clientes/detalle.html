{% extends "base.html" %}
{% block title %}Detalle{% endblock %}
{% block content %}
<body>
    <h2>Rutinas de {{ cliente.nombre }}</h2>
<ul>
    {% for rutina in cliente.rutinas.all %}
    <li>
      <a href="{% url 'rutinas:rutina_detalle' rutina.id %}">
        {{ rutina.nombre }}
      </a>
    </li>
  {% empty %}
    <li>No tiene rutinas asignadas.</li>
  {% endfor %}
</ul>

    <a href="{% url 'clientes:lista' %}">Volver</a>
</body>
</html>
{% endblock %}
