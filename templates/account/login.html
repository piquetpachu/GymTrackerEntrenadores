{% extends "base.html" %}
{% load socialaccount %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-br from-blue-900 to-blue-700">
  <div class="bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
    <h2 class="text-2xl font-bold text-orange-400 mb-6">Iniciar sesión</h2>

    <form method="POST" action="{% url 'account_login' %}" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit"
        class="w-full py-2 bg-orange-500 hover:bg-orange-600 transition text-white font-semibold rounded-lg">
        Iniciar sesión
      </button>
    </form>

    <div class="mt-6 text-gray-300">
      <p>¿No tenés una cuenta?
        <a href="{% url 'account_signup' %}" class="text-orange-400 hover:underline">Registrate</a>
      </p>
    </div>

    <div class="mt-6">
      <a href="{% provider_login_url 'google' %}"
        class="inline-flex items-center gap-2 px-4 py-2 bg-white text-gray-800 rounded-lg shadow-md hover:bg-gray-100 transition">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5" />
        Iniciar sesión con Google
      </a>
    </div>
  </div>
</div>
{% endblock %}
