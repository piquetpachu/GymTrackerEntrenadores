{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-br from-blue-900 to-blue-700">
  <div class="bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
    <h2 class="text-2xl font-bold text-orange-400 mb-6">Crear cuenta</h2>

    <form method="POST" action="{% url 'account_signup' %}" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit"
        class="w-full py-2 bg-orange-500 hover:bg-orange-600 transition text-white font-semibold rounded-lg">
        Registrarse
      </button>
    </form>

    <div class="mt-6 text-gray-300">
      <p>¿Ya tenés cuenta?
        <a href="{% url 'account_login' %}" class="text-orange-400 hover:underline">Iniciá sesión</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
