<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <title>{% block title %}GymTrack{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

  </head>
  <body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">🏋️ GymTrack</a>
            <div class="d-flex gap-2">
                <a href="{% url 'clientes:lista' %}" class="btn btn-outline-light">👤 Clientes</a>
                <a href="{% url 'ejercicios:lista' %}" class="btn btn-outline-light">📋 Ejercicios</a>
                <a href="{% url 'rutinas:lista' %}" class="btn btn-outline-light">📑 Rutinas</a>
                <a href="{% url 'progreso:index' %}" class="btn btn-outline-light">📈 Progreso</a>
                {% if user.is_authenticated %}
                  <li class="nav-item">
                    <span class="navbar-brand fw-bold">Hola, {{ user.username }}</span>
                  </li>
                  <li class="nav-item">
                    <a class="btn btn-outline-danger" href="{% url 'usuarios:logout' %}">Cerrar sesión</a>
                  </li>
                {% else %}
                  <li class="nav-item">
                    <a class="btn btn-outline-warning" href="{% url 'usuarios:login' %}">Iniciar sesión</a>
                  </li>
                {% endif %}            </div>
                </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
