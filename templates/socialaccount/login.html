{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-br from-blue-900 to-blue-700">
  <div class="bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
    <h2 class="text-2xl font-bold text-orange-400 mb-4">
      Inicio de sesión mediante Google
    </h2>
    <p class="text-gray-300 mb-6">
      Se dispone a iniciar sesión usando una cuenta externa desde Google.
    </p>

    <form method="post">
      {% csrf_token %}
      <button type="submit"
        class="w-full py-2 bg-orange-500 hover:bg-orange-600 transition text-white font-semibold rounded-lg">
        Continuar
      </button>
    </form>
  </div>
</div>
{% endblock %}
